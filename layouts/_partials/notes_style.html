<style>
.notes-toc { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 24px; font-size: 15px; }
.notes-toc a { color: var(--secondary); border-bottom: 1px solid var(--border); }
.notes-toc a:hover { color: var(--primary); }
.notes-group { margin-bottom: 28px; }
.notes-group h2 { font-size: 20px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.notes-group h2 .cnt { font-size: 14px; font-weight: normal; color: var(--secondary); margin-left: 6px; }
.notes-list { list-style: none; padding: 0; margin: 0; }
.notes-list li { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 16px; line-height: 1.5; }
.notes-list li a { flex: 1; color: var(--primary); }
.notes-list li a:hover { text-decoration: underline; }
.notes-list time { flex: none; font-size: 13px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.notes-badge { flex: none; font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--code-bg); color: var(--secondary); }
</style>
<style>
.notes-list-en li { align-items: flex-start; }
.notes-en-main { flex: 1; }
.notes-en-main .notes-badge { margin-left: 6px; vertical-align: 1px; }
.notes-en-summary { font-size: 14px; color: var(--secondary); line-height: 1.5; margin-top: 2px; }
</style>
